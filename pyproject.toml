[project]
name = "kicad-mcp"
version = "0.3.0"
description = "KiCad MCP server — PCB/schematic design automation via MCP tools and REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "httpx>=0.27",
    "pydantic>=2.0",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.23",
    "prefab-ui>=0.18.0",
    "playwright>=1.50",
]

[project.optional-dependencies]
ipc = [
    "kicad-python>=0.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.0,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_mcp"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "UP", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["E501"]
"tests/**/*.py" = ["E501", "S101"]
"src/kicad_mcp/kc_bridge.py" = ["S110"]
"src/kicad_mcp/server.py" = ["S603", "S110", "S607", "S104"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0,<0.17",
]
